<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">TLS protection ends at each termination boundary</title><desc id="desc">Browser TLS A → Edge proxy; Edge proxy TLS / mTLS B → Internal service; Identity provider authenticate → Browser; Internal service authorize → Resource policy; Resource policy permit → Protected data</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">TLS protection ends at each termination boundary</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="241.0" y="94.5" width="43.0" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">TLS A</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="492.9" y="94.5" width="89.19999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">TLS / mTLS B</text><path d="M 125.0 255 C 125.0 255, 125.0 150, 125.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="80.4" y="179.5" width="89.19999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="125.0" y="192.5" text-anchor="middle" class="small">authenticate</text><path d="M 675.0 150 C 675.0 202.5, 400.0 202.5, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="587.6936" y="161.05696" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="622.3936" y="174.05696" text-anchor="middle" class="small">authorize</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="512.7" y="264.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">permit</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Browser</text><text x="53" y="134" class="small">validates server name</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Edge proxy</text><text x="328" y="134" class="small">decrypts channel A</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Internal service</text><text x="603" y="134" class="small">validates identity</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Identity provider</text><text x="53" y="304" class="small">credential source</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Resource policy</text><text x="328" y="304" class="small">tenant + action</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Protected data</text><text x="603" y="304" class="small">allowed result only</text><text x="30" y="380" class="small">Encryption, peer authentication, and business authorization answer different questions.</text></svg>