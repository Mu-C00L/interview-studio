<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Packets, layers &amp; encapsulation</title><desc id="desc">Packets, layers &amp; encapsulation guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Packets, layers &amp; encapsulation</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Prepare the payload</text><text x="46" y="170" class="body">The application forms a</text><text x="46" y="188" class="body">request; transport supplies</text><text x="46" y="206" class="body">connection/stream behavior</text><text x="46" y="224" class="body">according to its protocol.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Choose a route</text><text x="304" y="170" class="body">IP determines the</text><text x="304" y="188" class="body">destination and next hop.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Unwrap at the receiver</text><text x="562" y="170" class="body">The destination validates</text><text x="562" y="188" class="body">and delivers the payload up</text><text x="562" y="206" class="body">the stack.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>