<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Normalization, dependencies &amp; denormalization</title><desc id="desc">Normalization, dependencies &amp; denormalization guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Normalization, dependencies &amp; denormalization</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Identify each fact</text><text x="46" y="170" class="body">Distinguish current customer</text><text x="46" y="188" class="body">information from historical</text><text x="46" y="206" class="body">order facts.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Assign authority</text><text x="304" y="170" class="body">Store current contact data</text><text x="304" y="188" class="body">once and reference the</text><text x="304" y="206" class="body">customer key from orders.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Add projections</text><text x="562" y="168" class="label">consciously</text><text x="562" y="189" class="body">If a read model duplicates</text><text x="562" y="207" class="body">current contact information,</text><text x="562" y="225" class="body">document refresh and</text><text x="562" y="243" class="body">staleness rather than</text><text x="562" y="261" class="body">treating both copies as</text><text x="562" y="279" class="body">authoritative.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>