<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">A process owns shared state; threads own execution context</title><desc id="desc">Thread A accesses → Process address space; Thread B accesses → Process address space; Thread A system call → Kernel; Kernel may block → Waiting state; Waiting state I/O completes → Runnable queue; Runnable queue scheduled → Thread B</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">A process owns shared state; threads own execution context</text><path d="M 315 117.5 C 315 117.5, 210 117.5, 210 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="231.1" y="94.5" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">accesses</text><path d="M 675.0 85 C 675.0 49, 125.0 49, 125.0 85" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="368.6" y="62.0" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="400.0" y="75.0" text-anchor="middle" class="small">accesses</text><path d="M 400.0 150 C 400.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="306.0936" y="161.05696" width="82.6" height="18" rx="4" fill="#f0f5ed"/><text x="347.3936" y="174.05696" text-anchor="middle" class="small">system call</text><path d="M 210 287.5 C 210 287.5, 315 287.5, 315 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="227.8" y="264.5" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="277.5" text-anchor="middle" class="small">may block</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="489.6" y="264.5" width="95.8" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">I/O completes</text><path d="M 675.0 255 C 675.0 255, 675.0 150, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="640.3" y="179.5" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="675.0" y="192.5" text-anchor="middle" class="small">scheduled</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Process address space</text><text x="53" y="134" class="small">shared code + heap</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Thread A</text><text x="328" y="134" class="small">stack + registers</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Thread B</text><text x="603" y="134" class="small">stack + registers</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Kernel</text><text x="53" y="304" class="small">privileged services</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Waiting state</text><text x="328" y="304" class="small">I/O not ready</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Runnable queue</text><text x="603" y="304" class="small">eligible for CPU</text><text x="30" y="380" class="small">Schematic: a syscall is a privilege transition; it need not switch to another process.</text></svg>