<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Encapsulation puts the rule with the state</title><desc id="desc">Caller invoke → Wallet operation; Wallet operation invalid → Rejected request; Wallet operation eligible → Valid transition; Valid transition update → Private balance; Private balance read → Observed result</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Encapsulation puts the rule with the state</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="237.7" y="94.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">invoke</text><path d="M 400.0 150 C 400.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="319.29359999999997" y="161.05696" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="347.3936" y="174.05696" text-anchor="middle" class="small">invalid</text><path d="M 400.0 150 C 400.0 150, 400.0 255, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="368.6" y="206.5" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="400.0" y="219.5" text-anchor="middle" class="small">eligible</text><path d="M 400.0 255 C 400.0 202.5, 675.0 202.5, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="427.8064" y="184.94304" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="452.6064" y="197.94304" text-anchor="middle" class="small">update</text><path d="M 675.0 150 C 675.0 150, 675.0 255, 675.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="656.8" y="179.5" width="36.4" height="18" rx="4" fill="#f0f5ed"/><text x="675.0" y="192.5" text-anchor="middle" class="small">read</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Caller</text><text x="53" y="134" class="small">requests spend(150)</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Wallet operation</text><text x="328" y="134" class="small">validate amount</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Private balance</text><text x="603" y="134" class="small">must remain &gt;= 0</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Rejected request</text><text x="53" y="304" class="small">no state change</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Valid transition</text><text x="328" y="304" class="small">subtract atomically here</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Observed result</text><text x="603" y="304" class="small">new balance or failure</text><text x="30" y="380" class="small">This local teaching object is single-threaded; concurrency needs a larger explicit guarantee.</text></svg>