<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Orchestration separates desired state and worker execution</title><desc id="desc">Desired workload declare → Control plane; Control plane place → Worker node; Worker node run → Pod A; Worker node run → Pod B; Pod A readiness → Service routing; Pod B readiness → Service routing</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Orchestration separates desired state and worker execution</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="234.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">declare</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="516.0" y="94.5" width="43.0" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">place</text><path d="M 675.0 150 C 675.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="554.8872" y="161.05696" width="29.799999999999997" height="18" rx="4" fill="#f0f5ed"/><text x="569.7872" y="174.05696" text-anchor="middle" class="small">run</text><path d="M 675.0 150 C 675.0 202.5, 400.0 202.5, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="607.4936" y="161.05696" width="29.799999999999997" height="18" rx="4" fill="#f0f5ed"/><text x="622.3936" y="174.05696" text-anchor="middle" class="small">run</text><path d="M 125.0 320 C 125.0 354, 675.0 354, 675.0 320" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="195.51280000000003" y="344.5632" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="230.21280000000004" y="357.5632" text-anchor="middle" class="small">readiness</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="502.8" y="264.5" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">readiness</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Desired workload</text><text x="53" y="134" class="small">replicas + resources</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Control plane</text><text x="328" y="134" class="small">reconcile / schedule</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Worker node</text><text x="603" y="134" class="small">shared host kernel</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Pod A</text><text x="53" y="304" class="small">application container</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Pod B</text><text x="328" y="304" class="small">application container</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Service routing</text><text x="603" y="304" class="small">ready endpoints only</text><text x="30" y="380" class="small">Restart and rescheduling do not replace durable state, idempotency, or recovery design.</text></svg>