<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">A regional failover must establish one write authority</title><desc id="desc">Clients normal writes → Region A; Region A replicate → Region B; Authority protocol promote safely → Region B; Recovery dependencies required → Region B; Region B after recovery → Reconciliation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">A regional failover must establish one write authority</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="214.6" y="94.5" width="95.8" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">normal writes</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="502.8" y="94.5" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">replicate</text><path d="M 125.0 255 C 125.0 202.5, 675.0 202.5, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="179.01280000000006" y="197.94304" width="102.39999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="230.21280000000004" y="210.94304" text-anchor="middle" class="small">promote safely</text><path d="M 400.0 255 C 400.0 202.5, 675.0 202.5, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.20640000000003" y="197.94304" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="452.6064" y="210.94304" text-anchor="middle" class="small">required</text><path d="M 675.0 150 C 675.0 150, 675.0 255, 675.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="623.8" y="179.5" width="102.39999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="675.0" y="192.5" text-anchor="middle" class="small">after recovery</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Clients</text><text x="53" y="134" class="small">routing + reconnect</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Region A</text><text x="328" y="134" class="small">current writer</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Region B</text><text x="603" y="134" class="small">standby replica</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Authority protocol</text><text x="53" y="304" class="small">promotion + fencing</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Recovery dependencies</text><text x="328" y="304" class="small">keys, services, quotas</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Reconciliation</text><text x="603" y="304" class="small">restore and fail back</text><text x="30" y="380" class="small">Async replication can leave a loss window; inability to reach A does not prove A stopped.</text></svg>