<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Java equality, generics &amp; collection contracts</title><desc id="desc">Java equality, generics &amp; collection contracts guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Java equality, generics &amp; collection contracts</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Choose identity</text><text x="46" y="170" class="body">Decide whether the object is</text><text x="46" y="188" class="body">an entity with stable ID or</text><text x="46" y="206" class="body">a value compared by its</text><text x="46" y="224" class="body">components.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Preserve collection</text><text x="304" y="168" class="label">assumptions</text><text x="304" y="189" class="body">Keep hash/equality-relevant</text><text x="304" y="207" class="body">state stable while the</text><text x="304" y="225" class="body">object is used as a key.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Protect the boundary</text><text x="562" y="170" class="body">Return immutable/copy</text><text x="562" y="188" class="body">semantics appropriate to</text><text x="562" y="206" class="body">callers instead of exposing</text><text x="562" y="224" class="body">an internal collection that</text><text x="562" y="242" class="body">can be mutated arbitrarily.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>