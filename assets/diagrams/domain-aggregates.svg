<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Business boundaries are not one service per table</title><desc id="desc">Client use case command → Order module; Order module coordinates → Public contracts; Public contracts reservation → Inventory module; Public contracts payment → Billing module; Public contracts evaluate costs → Deployment choice</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Business boundaries are not one service per table</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="234.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">command</text><path d="M 400.0 150 C 400.0 150, 400.0 255, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="358.7" y="179.5" width="82.6" height="18" rx="4" fill="#f0f5ed"/><text x="400.0" y="192.5" text-anchor="middle" class="small">coordinates</text><path d="M 400.0 255 C 400.0 202.5, 675.0 202.5, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="411.3064" y="224.94304" width="82.6" height="18" rx="4" fill="#f0f5ed"/><text x="452.6064" y="237.94304" text-anchor="middle" class="small">reservation</text><path d="M 315 287.5 C 315 287.5, 210 287.5, 210 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="234.4" y="264.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="277.5" text-anchor="middle" class="small">payment</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="453.88608000000005" y="264.5" width="102.39999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="505.08608000000004" y="277.5" text-anchor="middle" class="small">evaluate costs</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Client use case</text><text x="53" y="134" class="small">place an order</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Order module</text><text x="328" y="134" class="small">owns order rules</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Inventory module</text><text x="603" y="134" class="small">owns stock</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Billing module</text><text x="53" y="304" class="small">owns payment facts</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Public contracts</text><text x="328" y="304" class="small">explicit integration</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Deployment choice</text><text x="603" y="304" class="small">together or separate</text><text x="30" y="380" class="small">A modular monolith and microservices can share the same logical boundaries.</text></svg>