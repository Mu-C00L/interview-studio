<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Linked lists &amp; pointer discipline</title><desc id="desc">Linked lists &amp; pointer discipline guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Linked lists &amp; pointer discipline</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Partition the structure</text><text x="46" y="170" class="body">At each reversal step,</text><text x="46" y="188" class="body">previous points to the</text><text x="46" y="206" class="body">reversed prefix and current</text><text x="46" y="224" class="body">to the unprocessed suffix.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Save the bridge</text><text x="304" y="170" class="body">Read current-&gt;next before</text><text x="304" y="188" class="body">overwriting it.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Keep ownership separate</text><text x="562" y="170" class="body">Reversal changes links but</text><text x="562" y="188" class="body">does not allocate or delete</text><text x="562" y="206" class="body">nodes.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>