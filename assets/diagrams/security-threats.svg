<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Untrusted input crosses an authority boundary</title><desc id="desc">User request credential → Identity check; Identity check trusted identity → Policy decision; Attacker variation must reject → Policy decision; Policy decision allowed scope → Export service; Export service read → Tenant data</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Untrusted input crosses an authority boundary</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="224.5" y="94.5" width="76.0" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">credential</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="447.28608" y="94.49999999999999" width="115.6" height="18" rx="4" fill="#f0f5ed"/><text x="505.08608000000004" y="107.49999999999999" text-anchor="middle" class="small">trusted identity</text><path d="M 125.0 255 C 125.0 202.5, 675.0 202.5, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="188.91280000000006" y="197.94304" width="82.6" height="18" rx="4" fill="#f0f5ed"/><text x="230.21280000000004" y="210.94304" text-anchor="middle" class="small">must reject</text><path d="M 675.0 150 C 675.0 202.5, 400.0 202.5, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="574.4936" y="161.05696" width="95.8" height="18" rx="4" fill="#f0f5ed"/><text x="622.3936" y="174.05696" text-anchor="middle" class="small">allowed scope</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="519.3" y="264.5" width="36.4" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">read</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">User request</text><text x="53" y="134" class="small">untrusted tenantId</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Identity check</text><text x="328" y="134" class="small">who is calling?</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Policy decision</text><text x="603" y="134" class="small">may they access it?</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Attacker variation</text><text x="53" y="304" class="small">another tenantId</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Export service</text><text x="328" y="304" class="small">enforced scope</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Tenant data</text><text x="603" y="304" class="small">protected asset</text><text x="30" y="380" class="small">TLS and login do not grant permission to every tenant or resource.</text></svg>