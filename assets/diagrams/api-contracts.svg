<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">API contracts: retries, pagination &amp; compatible evolution</title><desc id="desc">API contracts: retries, pagination &amp; compatible evolution guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">API contracts: retries, pagination &amp; compatible evolution</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Write the happy-path</text><text x="46" y="168" class="label">contract</text><text x="46" y="189" class="body">Name inputs, validation,</text><text x="46" y="207" class="body">authorization scope, and the</text><text x="46" y="225" class="body">success response.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Add ambiguous outcomes</text><text x="304" y="170" class="body">Define duplicate keys,</text><text x="304" y="188" class="body">concurrent modifications,</text><text x="304" y="206" class="body">empty pages, rate limits,</text><text x="304" y="224" class="body">and timeouts.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Plan mixed-version</text><text x="562" y="168" class="label">deployment</text><text x="562" y="189" class="body">Add optional fields with</text><text x="562" y="207" class="body">defaults, keep old meanings</text><text x="562" y="225" class="body">stable, and retire fields</text><text x="562" y="243" class="body">only after observing that</text><text x="562" y="261" class="body">clients no longer depend on</text><text x="562" y="279" class="body">them.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>