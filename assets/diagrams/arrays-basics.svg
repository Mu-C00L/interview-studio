<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Reverse a vector by fixing mirrored pairs</title><desc id="desc">Reverse a vector by fixing mirrored pairs. Outside the active boundaries, every value is already in its final reversed position.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Reverse a vector by fixing mirrored pairs</text><rect x="30.0" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="40.0" y="105.0" class="label">Step</text><rect x="276.66666666666663" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="286.66666666666663" y="105.0" class="label">Array</text><rect x="523.3333333333333" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="533.3333333333333" y="105.0" class="label">Fixed positions</text><rect x="30.0" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="151.0" class="body">Start</text><rect x="276.66666666666663" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="151.0" class="body">[4,8,1,7,3]</text><rect x="523.3333333333333" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="151.0" class="body">none</text><rect x="30.0" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="197.0" class="body">Swap 0 and 4</text><rect x="276.66666666666663" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="197.0" class="body">[3,8,1,7,4]</text><rect x="523.3333333333333" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="197.0" class="body">0 and 4</text><rect x="30.0" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="243.0" class="body">Swap 1 and 3</text><rect x="276.66666666666663" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="243.0" class="body">[3,7,1,8,4]</text><rect x="523.3333333333333" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="243.0" class="body">0,1,3,4</text><rect x="30.0" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="289.0" class="body">Stop at center</text><rect x="276.66666666666663" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="289.0" class="body">[3,7,1,8,4]</text><rect x="523.3333333333333" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="289.0" class="body">all</text><text x="30" y="380" class="small">Outside the active boundaries, every value is already in its final reversed position.</text></svg>