<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Application protocols: HTTP, mail, file transfer &amp; sessions</title><desc id="desc">Application protocols: HTTP, mail, file transfer &amp; sessions guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Application protocols: HTTP, mail, file transfer &amp; sessions</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Identify the application</text><text x="46" y="168" class="label">action</text><text x="46" y="189" class="body">Retrieve a page, mutate a</text><text x="46" y="207" class="body">resource, submit mail,</text><text x="46" y="225" class="body">synchronize a mailbox, or</text><text x="46" y="243" class="body">transfer a file.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Choose and secure the</text><text x="304" y="168" class="label">protocol</text><text x="304" y="189" class="body">Specify message semantics,</text><text x="304" y="207" class="body">identity validation,</text><text x="304" y="225" class="body">encryption boundary, and</text><text x="304" y="243" class="body">permitted operations.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Handle lifecycle and</text><text x="562" y="168" class="label">errors</text><text x="562" y="189" class="body">Define expiry, revocation,</text><text x="562" y="207" class="body">retries, redirection, and</text><text x="562" y="225" class="body">how a caller resolves an</text><text x="562" y="243" class="body">uncertain mutation outcome.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>