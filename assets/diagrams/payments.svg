<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">A timeout does not decide a payment outcome</title><desc id="desc">Payment intent execute → Provider attempt; Provider attempt timeout → Unknown outcome; Unknown outcome resolve → Reconciliation; Reconciliation known success → Ledger transaction; Ledger transaction same commit → Outbox</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">A timeout does not decide a payment outcome</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="234.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">execute</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="509.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">timeout</text><path d="M 675.0 150 C 675.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="541.6872" y="161.05696" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="569.7872" y="174.05696" text-anchor="middle" class="small">resolve</text><path d="M 210 287.5 C 210 287.5, 315 287.5, 315 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="214.6" y="264.5" width="95.8" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="277.5" text-anchor="middle" class="small">known success</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="496.2" y="264.5" width="82.6" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">same commit</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Payment intent</text><text x="53" y="134" class="small">stable identity</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Provider attempt</text><text x="328" y="134" class="small">idempotency contract</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Unknown outcome</text><text x="603" y="134" class="small">response missing</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Reconciliation</text><text x="53" y="304" class="small">query + verified events</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Ledger transaction</text><text x="328" y="304" class="small">unique balanced posting</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Outbox</text><text x="603" y="304" class="small">durable downstream</text><text x="603" y="318" class="small">intent</text><text x="30" y="380" class="small">A refund is a new linked operation; never erase the original charge history.</text></svg>