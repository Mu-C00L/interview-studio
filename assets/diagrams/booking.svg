<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">A seat hold and payment can finish differently</title><desc id="desc">HELD pay → PAYMENT PENDING; PAYMENT PENDING valid success → CONFIRMED; HELD time passes → EXPIRED; EXPIRED late callback → LATE SUCCESS; LATE SUCCESS recover → COMPENSATE</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">A seat hold and payment can finish differently</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="247.6" y="94.5" width="29.799999999999997" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">pay</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="489.6" y="94.5" width="95.8" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">valid success</text><path d="M 125.0 150 C 125.0 150, 125.0 255, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="83.7" y="179.5" width="82.6" height="18" rx="4" fill="#f0f5ed"/><text x="125.0" y="192.5" text-anchor="middle" class="small">time passes</text><path d="M 210 287.5 C 210 287.5, 315 287.5, 315 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="214.6" y="264.5" width="95.8" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="277.5" text-anchor="middle" class="small">late callback</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="509.4" y="264.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">recover</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">HELD</text><text x="53" y="134" class="small">owner + expiry</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">PAYMENT PENDING</text><text x="328" y="134" class="small">outcome may be unknown</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">CONFIRMED</text><text x="603" y="134" class="small">eligible hold only</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">EXPIRED</text><text x="53" y="304" class="small">seat may be reassigned</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">LATE SUCCESS</text><text x="328" y="304" class="small">money captured too late</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">COMPENSATE</text><text x="603" y="304" class="small">refund / reconcile</text><text x="30" y="380" class="small">Confirm with expected owner/version; never steal a seat from a newer reservation.</text></svg>