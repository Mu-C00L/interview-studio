<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Publish a file and reason about crash durability</title><desc id="desc">Temporary file prepare → File flush; File flush publish → Atomic rename; Atomic rename visibility → Old readers; Atomic rename durability → Directory metadata; Directory metadata verify → Recovery check</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Publish a file and reason about crash durability</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="234.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">prepare</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="509.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">publish</text><path d="M 675.0 150 C 675.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="531.7872" y="161.05696" width="76.0" height="18" rx="4" fill="#f0f5ed"/><text x="569.7872" y="174.05696" text-anchor="middle" class="small">visibility</text><path d="M 675.0 150 C 675.0 202.5, 400.0 202.5, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="584.3936" y="188.05696" width="76.0" height="18" rx="4" fill="#f0f5ed"/><text x="622.3936" y="201.05696" text-anchor="middle" class="small">durability</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="512.7" y="264.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">verify</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Temporary file</text><text x="53" y="134" class="small">complete new bytes</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">File flush</text><text x="328" y="134" class="small">persist as required</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Atomic rename</text><text x="603" y="134" class="small">publish active name</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Old readers</text><text x="53" y="304" class="small">old/new complete file</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Directory metadata</text><text x="328" y="304" class="small">persist name change</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Recovery check</text><text x="603" y="304" class="small">after crash/restart</text><text x="30" y="380" class="small">Exact flush/rename guarantees depend on the OS and filesystem; multi-file updates need more.</text></svg>