<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Case study: elevator controller</title><desc id="desc">Case study: elevator controller guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Case study: elevator controller</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Separate optimization</text><text x="46" y="168" class="label">from safety</text><text x="46" y="189" class="body">The dispatcher chooses a</text><text x="46" y="207" class="body">car; the car controller</text><text x="46" y="225" class="body">rejects movement while doors</text><text x="46" y="243" class="body">are open.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Model events instead of</text><text x="304" y="168" class="label">sleeps</text><text x="304" y="189" class="body">Floor arrival, obstruction,</text><text x="304" y="207" class="body">door closure, and new</text><text x="304" y="225" class="body">requests drive transitions.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Check fairness under</text><text x="562" y="168" class="label">sustained load</text><text x="562" y="189" class="body">A direction-based strategy</text><text x="562" y="207" class="body">can delay opposing calls if</text><text x="562" y="225" class="body">new aligned requests keep</text><text x="562" y="243" class="body">arriving.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>