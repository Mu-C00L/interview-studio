<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">LEFT JOIN preserves Bob even without an order</title><desc id="desc">Customers left rows → LEFT JOIN; Orders matches → LEFT JOIN; LEFT JOIN aggregate → GROUP BY customer; GROUP BY customer non-NULL IDs → COUNT(order.id); GROUP BY customer all output rows → COUNT(*)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">LEFT JOIN preserves Bob even without an order</text><path d="M 125.0 85 C 125.0 49, 675.0 49, 675.0 85" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="365.3" y="62.0" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="400.0" y="75.0" text-anchor="middle" class="small">left rows</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="509.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">matches</text><path d="M 675.0 150 C 675.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="535.0871999999999" y="161.05696" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="569.7872" y="174.05696" text-anchor="middle" class="small">aggregate</text><path d="M 210 287.5 C 210 287.5, 315 287.5, 315 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="217.9" y="264.5" width="89.19999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="277.5" text-anchor="middle" class="small">non-NULL IDs</text><path d="M 125.0 320 C 125.0 354, 675.0 354, 675.0 320" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="175.71280000000004" y="344.5632" width="109.0" height="18" rx="4" fill="#f0f5ed"/><text x="230.21280000000004" y="357.5632" text-anchor="middle" class="small">all output rows</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Customers</text><text x="53" y="134" class="small">Alice, Bob</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Orders</text><text x="328" y="134" class="small">A1, A2 for Alice</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">LEFT JOIN</text><text x="603" y="134" class="small">Alice×2; Bob×1</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">GROUP BY customer</text><text x="53" y="304" class="small">one output/customer</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">COUNT(order.id)</text><text x="328" y="304" class="small">Alice=2, Bob=0</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">COUNT(*)</text><text x="603" y="304" class="small">Alice=2, Bob=1</text><text x="30" y="380" class="small">Choose the output grain and count actual matches; NULL-extended rows still exist.</text></svg>