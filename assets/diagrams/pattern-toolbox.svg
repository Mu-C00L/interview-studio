<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Command, builder, chain &amp; template patterns</title><desc id="desc">Command, builder, chain &amp; template patterns guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Command, builder, chain &amp; template patterns</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Locate variation</text><text x="46" y="170" class="body">Construction variation</text><text x="46" y="188" class="body">suggests a builder; deferred</text><text x="46" y="206" class="body">actions suggest commands;</text><text x="46" y="224" class="body">ordered cross-cutting checks</text><text x="46" y="242" class="body">suggest a chain.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Define the contract</text><text x="304" y="170" class="body">Specify handler order, stop</text><text x="304" y="188" class="body">behavior, errors, and</text><text x="304" y="206" class="body">whether retry can repeat</text><text x="304" y="224" class="body">effects.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Keep it explainable</text><text x="562" y="170" class="body">Implement the smallest</text><text x="562" y="188" class="body">structure that makes the use</text><text x="562" y="206" class="body">case clear; avoid combining</text><text x="562" y="224" class="body">patterns merely to display</text><text x="562" y="242" class="body">their names.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>