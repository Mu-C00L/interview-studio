<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">The memory hierarchy</title><desc id="desc">Program executes → CPU registers; CPU registers load/store → CPU caches; CPU caches cache miss → Main memory; Storage page/data load → Main memory; Network service I/O response → Main memory</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">The memory hierarchy</text><path d="M 125.0 255 C 125.0 255, 125.0 150, 125.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="93.6" y="179.5" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="125.0" y="192.5" text-anchor="middle" class="small">executes</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="224.5" y="94.5" width="76.0" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">load/store</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="499.5" y="94.5" width="76.0" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">cache miss</text><path d="M 400.0 255 C 400.0 202.5, 675.0 202.5, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="401.4064" y="197.94304" width="102.39999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="452.6064" y="210.94304" text-anchor="middle" class="small">page/data load</text><path d="M 675.0 255 C 675.0 255, 675.0 150, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="630.4" y="179.5" width="89.19999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="675.0" y="192.5" text-anchor="middle" class="small">I/O response</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">CPU registers</text><text x="53" y="134" class="small">immediate operands</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">CPU caches</text><text x="328" y="134" class="small">nearby reused data</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Main memory</text><text x="603" y="134" class="small">resident working set</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Program</text><text x="53" y="304" class="small">instructions + data</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Storage</text><text x="328" y="304" class="small">persistent bytes</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Network service</text><text x="603" y="304" class="small">remote data</text><text x="30" y="380" class="small">Latency and capacity differ by machine; locality can dominate equal Big-O algorithms.</text></svg>