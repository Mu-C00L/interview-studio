<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">The window never moves left backward: &quot;abba&quot;</title><desc id="desc">The window never moves left backward: &quot;abba&quot;. Longest length = 2. max(left, last[byte]+1) preserves progress.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">The window never moves left backward: &quot;abba&quot;</text><rect x="30.0" y="77" width="185.0" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="40.0" y="105.0" class="label">Index / byte</text><rect x="215.0" y="77" width="185.0" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="225.0" y="105.0" class="label">Last occurrence</text><rect x="400.0" y="77" width="185.0" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="410.0" y="105.0" class="label">New left</text><rect x="585.0" y="77" width="185.0" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="595.0" y="105.0" class="label">Valid window</text><rect x="30.0" y="123" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="151.0" class="body">0 / a</text><rect x="215.0" y="123" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="225.0" y="151.0" class="body">none</text><rect x="400.0" y="123" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="410.0" y="151.0" class="body">0</text><rect x="585.0" y="123" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="595.0" y="151.0" class="body">a</text><rect x="30.0" y="169" width="185.0" height="46" fill="#f