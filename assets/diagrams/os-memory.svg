<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Translate virtual address 12,345 with 4 KiB pages</title><desc id="desc">Virtual address split → Virtual page 3; Virtual page 3 lookup → TLB / page table; TLB / page table validate → Permission check; TLB / page table mapping → Physical frame 9; Physical frame 9 add offset → Physical address</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Translate virtual address 12,345 with 4 KiB pages</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="241.0" y="94.5" width="43.0" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">split</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="512.7" y="94.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">lookup</text><path d="M 675.0 150 C 675.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="538.3872" y="161.05696" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="569.7872" y="174.05696" text-anchor="middle" class="small">validate</text><path d="M 675.0 150 C 675.0 202.5, 400.0 202.5, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="594.2936" y="188.05696" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="622.3936" y="201.05696" text-anchor="middle" class="small">mapping</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="499.5" y="264.5" width="76.0" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">add offset</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Virtual address</text><text x="53" y="134" class="small">12,345</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Virtual page 3</text><text x="328" y="134" class="small">offset = 57</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">TLB / page table</text><text x="603" y="134" class="small">page 3 → frame 9</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Permission check</text><text x="53" y="304" class="small">read/write allowed?</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Physical frame 9</text><text x="328" y="304" class="small">base = 36,864</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Physical address</text><text x="603" y="304" class="small">36,864 + 57 = 36,921</text><text x="30" y="380" class="small">A TLB miss is not automatically a page fault or a disk read.</text></svg>