<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">A bounded queue coordinates producers and consumers</title><desc id="desc">Producer insert → Protected queue; Protected queue remove → Consumer; Consumer notify → notFull; notFull wake/recheck → Producer; Producer notify → notEmpty; notEmpty wake/recheck → Consumer; Mutex protects → Protected queue</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">A bounded queue coordinates producers and consumers</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="237.7" y="94.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">insert</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="512.7" y="94.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">remove</text><path d="M 675.0 150 C 675.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="544.9872" y="161.05696" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="569.7872" y="174.05696" text-anchor="middle" class="small">notify</text><path d="M 125.0 255 C 125.0 255, 125.0 150, 125.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="80.4" y="179.5" width="89.19999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="125.0" y="192.5" text-anchor="middle" class="small">wake/recheck</text><path d="M 125.0 150 C 125.0 202.5, 675.0 202.5, 675.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="205.41280000000006" y="161.05696" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="230.21280000000004" y="174.05696" text-anchor="middle" class="small">notify</text><path d="M 675.0 255 C 675.0 255, 675.0 150, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="630.4" y="179.5" width="89.19999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="675.0" y="192.5" text-anchor="middle" class="small">wake/recheck</text><path d="M 400.0 255 C 400.0 255, 400.0 150, 400.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="368.6" y="179.5" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="400.0" y="192.5" text-anchor="middle" class="small">protects</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Producer</text><text x="53" y="134" class="small">wait while full</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Protected queue</text><text x="328" y="134" class="small">capacity = 2</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Consumer</text><text x="603" y="134" class="small">wait while empty</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">notFull</text><text x="53" y="304" class="small">capacity predicate</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Mutex</text><text x="328" y="304" class="small">guards queue state</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">notEmpty</text><text x="603" y="304" class="small">data predicate</text><text x="30" y="380" class="small">Condition waits release the mutex while waiting and recheck the predicate after waking.</text></svg>