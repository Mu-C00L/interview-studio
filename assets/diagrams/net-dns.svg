<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">DNS resolution uses delegation and caching</title><desc id="desc">Client lookup → Recursive resolver; Recursive resolver if needed → Root / TLD; Root / TLD delegate → Authoritative server; Authoritative server answer → Cached answer; Cached answer resolve → Client; Client connect → Connection pool</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">DNS resolution uses delegation and caching</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="237.7" y="94.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">lookup</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="502.8" y="94.5" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">if needed</text><path d="M 675.0 150 C 675.0 150, 675.0 255, 675.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="643.6" y="179.5" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="675.0" y="192.5" text-anchor="middle" class="small">delegate</text><path d="M 590 287.5 C 590 287.5, 485 287.5, 485 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="512.7" y="264.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">answer</text><path d="M 400.0 255 C 400.0 202.5, 125.0 202.5, 125.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="319.29359999999997" y="197.94304" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="347.3936" y="210.94304" text-anchor="middle" class="small">resolve</text><path d="M 125.0 150 C 125.0 150, 125.0 255, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="96.9" y="179.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="125.0" y="192.5" text-anchor="middle" class="small">connect</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Client</text><text x="53" y="134" class="small">asks for a name</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Recursive resolver</text><text x="328" y="134" class="small">cache first</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Root / TLD</text><text x="603" y="134" class="small">delegation</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Connection pool</text><text x="53" y="304" class="small">may outlive TTL</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Cached answer</text><text x="328" y="304" class="small">IP + remaining TTL</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Authoritative server</text><text x="603" y="304" class="small">zone records</text><text x="30" y="380" class="small">Existing cached answers and open connections do not change instantly at DNS cutover.</text></svg>