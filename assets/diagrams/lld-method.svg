<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">A complete LLD conversation: from rules to executable design</title><desc id="desc">A complete LLD conversation: from rules to executable design guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">A complete LLD conversation: from rules to executable design</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Write scenarios first</text><text x="46" y="170" class="body">List one success, one</text><text x="46" y="188" class="body">validation failure, one</text><text x="46" y="206" class="body">state conflict, and one</text><text x="46" y="224" class="body">repeated request.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Model only necessary</text><text x="304" y="168" class="label">state</text><text x="304" y="189" class="body">Use title, physical copy,</text><text x="304" y="207" class="body">member, and loan identities;</text><text x="304" y="225" class="body">place the availability</text><text x="304" y="243" class="body">invariant at one authority.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Prove one vertical</text><text x="562" y="168" class="label">operation</text><text x="562" y="189" class="body">Show the API, collaboration</text><text x="562" y="207" class="body">sequence, core</text><text x="562" y="225" class="body">code/transaction, and test</text><text x="562" y="243" class="body">assertions for borrow before</text><text x="562" y="261" class="body">expanding the feature.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>