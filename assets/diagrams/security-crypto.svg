<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Hashing, encryption, passwords &amp; keys</title><desc id="desc">Hashing, encryption, passwords &amp; keys guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Hashing, encryption, passwords &amp; keys</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Classify the need</text><text x="46" y="170" class="body">Decide whether you need</text><text x="46" y="188" class="body">secrecy,</text><text x="46" y="206" class="body">integrity/authenticity,</text><text x="46" y="224" class="body">password verification, or a</text><text x="46" y="242" class="body">non-security checksum.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Use a maintained</text><text x="304" y="168" class="label">implementation</text><text x="304" y="189" class="body">Select a standard scheme</text><text x="304" y="207" class="body">through a trusted library</text><text x="304" y="225" class="body">and follow its nonce, salt,</text><text x="304" y="243" class="body">and key requirements.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Operate the keys</text><text x="562" y="170" class="body">Record ownership, access</text><text x="562" y="188" class="body">policy, versioning,</text><text x="562" y="206" class="body">rotation, and recovery</text><text x="562" y="224" class="body">procedures without exposing</text><text x="562" y="242" class="body">secret material in logs.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>