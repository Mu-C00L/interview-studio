<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Monotonic stack resolves waiting days</title><desc id="desc">Monotonic stack resolves waiting days. Each index is pushed once and popped at most once. Output = [3,1,1,0].</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Monotonic stack resolves waiting days</text><rect x="30.0" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="40.0" y="105.0" class="label">Read temperature</text><rect x="276.66666666666663" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="286.66666666666663" y="105.0" class="label">Unresolved indices</text><rect x="523.3333333333333" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="533.3333333333333" y="105.0" class="label">Resolved now</text><rect x="30.0" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="151.0" class="body">73 at 0</text><rect x="276.66666666666663" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="151.0" class="body">[0]</text><rect x="523.3333333333333" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="151.0" class="body">none</text><rect x="30.0" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="197.0" class="body">71 at 1</text><rect x="276.66666666666663" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="197.0" class="body">[0,1]</text><rect x="523.3333333333333" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="197.0" class="body">none</text><rect x="30.0" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="243.0" class="body">72 at 2</text><rect x="276.66666666666663" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="243.0" class="body">[0,2]</text><rect x="523.3333333333333" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="243.0" class="body">index 1 waits 1</text><rect x="30.0" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="289.0" class="body">75 at 3</text><rect x="276.66666666666663" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="289.0" class="body">[3]</text><rect x="523.3333333333333" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="289.0" class="body">index 2 waits 1; 0 waits 3</text><text x="30" y="380" class="small">Each index is pushed once and popped at most once. Output = [3,1,1,0].</text></svg>