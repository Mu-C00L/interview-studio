<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Minimum spanning trees: connect everything at minimum cost</title><desc id="desc">Minimum spanning trees: connect everything at minimum cost guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Minimum spanning trees: connect everything at minimum cost</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Sort candidate edges</text><text x="46" y="170" class="body">Smaller weights are</text><text x="46" y="188" class="body">considered first; equal</text><text x="46" y="206" class="body">weights can be resolved</text><text x="46" y="224" class="body">consistently in any order.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Union only different</text><text x="304" y="168" class="label">components</text><text x="304" y="189" class="body">A successful union means</text><text x="304" y="207" class="body">this edge connects</text><text x="304" y="225" class="body">previously disconnected</text><text x="304" y="243" class="body">parts and is accepted.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Check the accepted count</text><text x="562" y="170" class="body">V−1 accepted edges prove a</text><text x="562" y="188" class="body">spanning tree for V&gt;0;</text><text x="562" y="206" class="body">otherwise return the</text><text x="562" y="224" class="body">explicit disconnected</text><text x="562" y="242" class="body">result.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>