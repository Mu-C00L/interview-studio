<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Restore needs a complete recovery chain</title><desc id="desc">Base backup restore → Restored database; WAL / log archive replay → Restored database; Recovery target stop point → Restored database; Keys + configuration enable → Restored database; Restored database validate/promote → Service recovery</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Restore needs a complete recovery chain</text><path d="M 125.0 150 C 125.0 202.5, 400.0 202.5, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="149.5064" y="161.05696" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="177.6064" y="174.05696" text-anchor="middle" class="small">restore</text><path d="M 400.0 150 C 400.0 150, 400.0 255, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="375.2" y="179.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="400.0" y="192.5" text-anchor="middle" class="small">replay</text><path d="M 675.0 150 C 675.0 202.5, 400.0 202.5, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="584.3936" y="161.05696" width="76.0" height="18" rx="4" fill="#f0f5ed"/><text x="622.3936" y="174.05696" text-anchor="middle" class="small">stop point</text><path d="M 210 287.5 C 210 287.5, 315 287.5, 315 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="237.7" y="264.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="277.5" text-anchor="middle" class="small">enable</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="447.28608" y="264.5" width="115.6" height="18" rx="4" fill="#f0f5ed"/><text x="505.08608000000004" y="277.5" text-anchor="middle" class="small">validate/promote</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Base backup</text><text x="53" y="134" class="small">consistent starting data</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">WAL / log archive</text><text x="328" y="134" class="small">required change history</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Recovery target</text><text x="603" y="134" class="small">chosen time/position</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Keys + configuration</text><text x="53" y="304" class="small">needed to read/start</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Restored database</text><text x="328" y="304" class="small">replay and validate</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Service recovery</text><text x="603" y="304" class="small">traffic + dependencies</text><text x="30" y="380" class="small">RPO concerns data loss; RTO concerns restoration time. Replicas can copy accidental deletion.</text></svg>