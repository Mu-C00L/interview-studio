<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Weighted shortest paths</title><desc id="desc">Weighted shortest paths guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Weighted shortest paths</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Compare edge assumptions</text><text x="46" y="170" class="body">Use BFS for uniform costs,</text><text x="46" y="188" class="body">0–1 BFS for weights in</text><text x="46" y="206" class="body">{0,1}, Dijkstra for</text><text x="46" y="224" class="body">nonnegative weights, and an</text><text x="46" y="242" class="body">appropriate negative-edge</text><text x="46" y="260" class="body">algorithm otherwise.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Keep improved candidates</text><text x="304" y="170" class="body">When a shorter distance is</text><text x="304" y="188" class="body">found, push it.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Explain finalization</text><text x="562" y="170" class="body">With nonnegative edges,</text><text x="562" y="188" class="body">extending a path from a</text><text x="562" y="206" class="body">farther unsettled vertex</text><text x="562" y="224" class="body">cannot produce a smaller</text><text x="562" y="242" class="body">settled distance.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>