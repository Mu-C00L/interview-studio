<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Connect user outcomes to diagnostic evidence</title><desc id="desc">User operation measure → Metrics; Metrics SLO/burn → Alert decision; User operation propagate context → Trace; Trace correlate → Structured logs; Alert decision trigger → Investigation; Structured logs evidence → Investigation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Connect user outcomes to diagnostic evidence</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="234.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">measure</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="506.1" y="94.5" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">SLO/burn</text><path d="M 125.0 150 C 125.0 150, 125.0 255, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="63.900000000000006" y="179.5" width="122.19999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="125.0" y="192.5" text-anchor="middle" class="small">propagate context</text><path d="M 210 287.5 C 210 287.5, 315 287.5, 315 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="227.8" y="264.5" width="69.4" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="277.5" text-anchor="middle" class="small">correlate</text><path d="M 675.0 150 C 675.0 150, 675.0 255, 675.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="646.9" y="179.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="675.0" y="192.5" text-anchor="middle" class="small">trigger</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="506.1" y="264.5" width="62.8" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">evidence</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">User operation</text><text x="53" y="134" class="small">correct + timely result</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Metrics</text><text x="328" y="134" class="small">rates / latency / load</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Alert decision</text><text x="603" y="134" class="small">actionable impact</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Trace</text><text x="53" y="304" class="small">spans + dependencies</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Structured logs</text><text x="328" y="304" class="small">event details</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Investigation</text><text x="603" y="304" class="small">test a hypothesis</text><text x="30" y="380" class="small">Use stable metric labels; retain high-cardinality request context in appropriate logs/traces.</text></svg>