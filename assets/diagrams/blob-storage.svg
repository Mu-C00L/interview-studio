-end="url(#arrow)"/><rect x="178.88608000000002" y="264.5" width="102.39999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="230.08608" y="277.5" text-anchor="middle" class="small">retryable work</text><path d="M 400.0 255 C 400.0 202.5, 675.0 202.5, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="401.4064" y="197.94304" width="102.39999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="452.6064" y="210.94304" text-anchor="middle" class="small">write variants</text><path d="M 675.0 255 C 675.0 255, 675.0 150, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="623.8" y="179.5" width="102.39999999999999" height="18" rx="4" fill="#f0f5ed"/><text x="675.0" y="192.5" text-anchor="middle" class="small">serve eligible</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Client</text><text x="53" y="134" class="small">upload capability</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Metadata service</text><text x="328" y="134" class="small">owner + lifecycle</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Object storage</text><text x="603" y="134" class="small">original + variants</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Durable job</text><text x="53" y="304" class="small">video ID + version</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Processing worker</text><text x="328" y="304" class="small">validate + transform</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Playback service</text><text x="603" y="304" class="small">authorize READY data</text><text x="30" y="380" class="small">READY requires validated outputs. Duplicate jobs reuse a stable logical output identity.</text></svg>