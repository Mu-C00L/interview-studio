<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">URL shortener: separate redirects from analytics</title><desc id="desc">Client request → Redirect service; Redirect service lookup → Cache; Redirect service cache miss → Link database; Redirect service async event → Event queue; Event queue consume → Analytics worker</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">URL shortener: separate redirects from analytics</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="234.4" y="94.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">request</text><path d="M 485 117.5 C 485 117.5, 590 117.5, 590 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="512.7" y="94.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="107.5" text-anchor="middle" class="small">lookup</text><path d="M 400.0 150 C 400.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="309.3936" y="161.05696" width="76.0" height="18" rx="4" fill="#f0f5ed"/><text x="347.3936" y="174.05696" text-anchor="middle" class="small">cache miss</text><path d="M 400.0 150 C 400.0 150, 400.0 255, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="358.7" y="206.5" width="82.6" height="18" rx="4" fill="#f0f5ed"/><text x="400.0" y="219.5" text-anchor="middle" class="small">async event</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="509.4" y="264.5" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">consume</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Client</text><text x="53" y="134" class="small">GET /short-code</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Redirect service</text><text x="328" y="134" class="small">validate + resolve</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Cache</text><text x="603" y="134" class="small">code → destination</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Link database</text><text x="53" y="304" class="small">authoritative record</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Event queue</text><text x="328" y="304" class="small">redirect event</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Analytics worker</text><text x="603" y="304" class="small">aggregate later</text><text x="30" y="380" class="small">Uniqueness is enforced at creation; cache outage and expiration need explicit behavior.</text></svg>