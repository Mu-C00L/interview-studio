<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Write skew: both doctors decide the other can stay on call</title><desc id="desc">Write skew: both doctors decide the other can stay on call. No same-row overwrite is required. The invariant spans both rows and needs suitable isolation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Write skew: both doctors decide the other can stay on call</text><rect x="30.0" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="40.0" y="105.0" class="label">Time</text><rect x="276.66666666666663" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="286.66666666666663" y="105.0" class="label">Transaction 1</text><rect x="523.3333333333333" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="533.3333333333333" y="105.0" class="label">Transaction 2</text><rect x="30.0" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="151.0" class="body">1</text><rect x="276.66666666666663" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="151.0" class="body">reads A=ON, B=ON</text><rect x="523.3333333333333" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="151.0" class="body">reads A=ON, B=ON</text><rect x="30.0" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="197.0" class="body">2</text><rect x="276.66666666666663" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="197.0" class="body">sets A=OFF</text><rect x="523.3333333333333" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="197.0" class="body">sets B=OFF</text><rect x="30.0" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="243.0" class="body">3</text><rect x="276.66666666666663" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="243.0" class="body">commits if allowed</text><rect x="523.3333333333333" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="243.0" class="body">commits if allowed</text><rect x="30.0" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="289.0" class="body">Result</text><rect x="276.66666666666663" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="289.0" class="body">A=OFF</text><rect x="523.3333333333333" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="289.0" class="body">B=OFF</text><text x="30" y="380" class="small">No same-row overwrite is required. The invariant spans both rows and needs suitable isolation.</text></svg>