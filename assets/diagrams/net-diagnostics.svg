<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">From URL to response: diagnose one layer at a time</title><desc id="desc">From URL to response: diagnose one layer at a time guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">From URL to response: diagnose one layer at a time</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Establish the symptom</text><text x="46" y="170" class="body">Record the exact URL, time,</text><text x="46" y="188" class="body">network context, error, and</text><text x="46" y="206" class="body">whether the failure is</text><text x="46" y="224" class="body">reproducible.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Probe the earliest</text><text x="304" y="168" class="label">uncertain layer</text><text x="304" y="189" class="body">Do not skip from “page slow”</text><text x="304" y="207" class="body">to changing database indexes</text><text x="304" y="225" class="body">without connection and</text><text x="304" y="243" class="body">server timing evidence.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Correlate with server</text><text x="562" y="168" class="label">observations</text><text x="562" y="189" class="body">Use request IDs and</text><text x="562" y="207" class="body">timestamps to connect client</text><text x="562" y="225" class="body">results to edge,</text><text x="562" y="243" class="body">application, and dependency</text><text x="562" y="261" class="body">telemetry without logging</text><text x="562" y="279" class="body">secrets.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>