<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Known bursts: A=8 ms, B=2 ms, C=1 ms; all arrive at 0</title><desc id="desc">Known bursts: A=8 ms, B=2 ms, C=1 ms; all arrive at 0. Switching cost omitted. Waiting time excludes CPU service; first-response time is different.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Known bursts: A=8 ms, B=2 ms, C=1 ms; all arrive at 0</text><rect x="30.0" y="77" width="185.0" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="40.0" y="105.0" class="label">Policy</text><rect x="215.0" y="77" width="185.0" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="225.0" y="105.0" class="label">Execution order</text><rect x="400.0" y="77" width="185.0" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="410.0" y="105.0" class="label">Waiting times</text><rect x="585.0" y="77" width="185.0" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="595.0" y="105.0" class="label">Mean wait</text><rect x="30.0" y="123" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="151.0" class="body">FCFS</text><rect x="215.0" y="123" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="225.0" y="151.0" class="body">A → B → C</text><rect x="400.0" y="123" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="410.0" y="151.0" class="body">0, 8, 10</text><rect x="585.0" y="123" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="595.0" y="151.0" class="body">6 ms</text><rect x="30.0" y="169" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="197.0" class="body">SJF</text><rect x="215.0" y="169" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="225.0" y="197.0" class="body">C → B → A</text><rect x="400.0" y="169" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="410.0" y="197.0" class="body">0, 1, 3</text><rect x="585.0" y="169" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="595.0" y="197.0" class="body">4/3 ms</text><rect x="30.0" y="215" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="243.0" class="body">Round robin q=2</text><rect x="215.0" y="215" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="225.0" y="243.0" class="body">A,B,C,A,A,A</text><rect x="400.0" y="215" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="410.0" y="243.0" class="body">A=3, B=2, C=4</text><rect x="585.0" y="215" width="185.0" height="46" fill="#fff" stroke="#cfdecb"/><text x="595.0" y="243.0" class="body">3 ms</text><text x="30" y="380" class="small">Switching cost omitted. Waiting time excludes CPU service; first-response time is different.</text></svg>