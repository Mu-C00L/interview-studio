<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Calls go down; answers come back up</title><desc id="desc">Calls go down; answers come back up. Input [3,5,2]. Four calls are made; the live stack depth is linear in prefix length.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Calls go down; answers come back up</text><rect x="30.0" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="40.0" y="105.0" class="label">Call</text><rect x="276.66666666666663" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="286.66666666666663" y="105.0" class="label">Waiting work</text><rect x="523.3333333333333" y="77" width="246.66666666666666" height="46" fill="#d6eec2" stroke="#cfdecb"/><text x="533.3333333333333" y="105.0" class="label">Returned answer</text><rect x="30.0" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="151.0" class="body">sum(3)</text><rect x="276.66666666666663" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="151.0" class="body">sum(2) + 2</text><rect x="523.3333333333333" y="123" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="151.0" class="body">10</text><rect x="30.0" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="197.0" class="body">sum(2)</text><rect x="276.66666666666663" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="197.0" class="body">sum(1) + 5</text><rect x="523.3333333333333" y="169" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="197.0" class="body">8</text><rect x="30.0" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="243.0" class="body">sum(1)</text><rect x="276.66666666666663" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="243.0" class="body">sum(0) + 3</text><rect x="523.3333333333333" y="215" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="243.0" class="body">3</text><rect x="30.0" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="40.0" y="289.0" class="body">sum(0)</text><rect x="276.66666666666663" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="286.66666666666663" y="289.0" class="body">base case</text><rect x="523.3333333333333" y="261" width="246.66666666666666" height="46" fill="#fff" stroke="#cfdecb"/><text x="533.3333333333333" y="289.0" class="body">0</text><text x="30" y="380" class="small">Input [3,5,2]. Four calls are made; the live stack depth is linear in prefix length.</text></svg>