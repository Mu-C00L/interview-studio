<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Testing contracts &amp; presenting LLD</title><desc id="desc">Testing contracts &amp; presenting LLD guided walkthrough</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Testing contracts &amp; presenting LLD</text><rect x="28" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="56" cy="107" r="17" fill="#d6eec2"/><text x="56" y="113" text-anchor="middle" class="label">1</text><text x="46" y="149" class="label">Convert an invariant into</text><text x="46" y="168" class="label">an assertion</text><text x="46" y="189" class="body">For LRU, assert bounded</text><text x="46" y="207" class="body">distinct size and correct</text><text x="46" y="225" class="body">victim after a touch.</text><rect x="286" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="314" cy="107" r="17" fill="#d6eec2"/><text x="314" y="113" text-anchor="middle" class="label">2</text><text x="304" y="149" class="label">Test the boundary you</text><text x="304" y="168" class="label">claim</text><text x="304" y="189" class="body">A fake repository can test</text><text x="304" y="207" class="body">orchestration but cannot</text><text x="304" y="225" class="body">prove real transactional</text><text x="304" y="243" class="body">uniqueness.</text><rect x="544" y="75" width="244" height="268" rx="12" fill="#fff" stroke="#bed2b7"/><circle cx="572" cy="107" r="17" fill="#d6eec2"/><text x="572" y="113" text-anchor="middle" class="label">3</text><text x="562" y="149" class="label">Explain the limitation</text><text x="562" y="170" class="body">A small deterministic test</text><text x="562" y="188" class="body">suite is evidence for</text><text x="562" y="206" class="body">selected contracts, not</text><text x="562" y="224" class="body">proof against all</text><text x="562" y="242" class="body">interleavings.</text><text x="30" y="380" class="small">Read the full walkthrough below, then explain each decision without looking.</text></svg>