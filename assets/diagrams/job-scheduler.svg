<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Lease recovery does not stop a paused worker</title><desc id="desc">Run R claim → Worker A; Worker A pause → Lease expiry; Lease expiry recover → Worker B; Worker A stale attempt → Protected effect; Worker B current attempt → Protected effect; Protected effect record → Run outcome</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386450"/></marker></defs><rect width="800" height="400" rx="16" fill="#f0f5ed"/><style>text{font-family:Arial,sans-serif;fill:#183b30}.title{font-size:19px;font-weight:700}.small{font-size:12px;fill:#567064}.label{font-size:14px;font-weight:700}.body{font-size:13px;fill:#40584d}</style><text x="30" y="37" class="title">Lease recovery does not stop a paused worker</text><path d="M 210 117.5 C 210 117.5, 315 117.5, 315 117.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="241.0" y="94.5" width="43.0" height="18" rx="4" fill="#f0f5ed"/><text x="262.5" y="107.5" text-anchor="middle" class="small">claim</text><path d="M 400.0 150 C 400.0 202.5, 125.0 202.5, 125.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="325.8936" y="161.05696" width="43.0" height="18" rx="4" fill="#f0f5ed"/><text x="347.3936" y="174.05696" text-anchor="middle" class="small">pause</text><path d="M 125.0 255 C 125.0 202.5, 675.0 202.5, 675.0 150" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="202.11280000000005" y="197.94304" width="56.199999999999996" height="18" rx="4" fill="#f0f5ed"/><text x="230.21280000000004" y="210.94304" text-anchor="middle" class="small">recover</text><path d="M 400.0 150 C 400.0 150, 400.0 255, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="352.1" y="206.5" width="95.8" height="18" rx="4" fill="#f0f5ed"/><text x="400.0" y="219.5" text-anchor="middle" class="small">stale attempt</text><path d="M 675.0 150 C 675.0 202.5, 400.0 202.5, 400.0 255" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="567.8936" y="161.05696" width="109.0" height="18" rx="4" fill="#f0f5ed"/><text x="622.3936" y="174.05696" text-anchor="middle" class="small">current attempt</text><path d="M 485 287.5 C 485 287.5, 590 287.5, 590 287.5" fill="none" stroke="#386450" stroke-width="2" marker-end="url(#arrow)"/><rect x="512.7" y="264.5" width="49.599999999999994" height="18" rx="4" fill="#f0f5ed"/><text x="537.5" y="277.5" text-anchor="middle" class="small">record</text><rect x="40" y="85" width="170" height="65" rx="10" fill="#d6eec2" stroke="#afc8ae"/><text x="53" y="108" class="label">Run R</text><text x="53" y="134" class="small">stable logical ID</text><rect x="315" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="108" class="label">Worker A</text><text x="328" y="134" class="small">lease epoch 4</text><rect x="590" y="85" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="108" class="label">Worker B</text><text x="603" y="134" class="small">new lease epoch 5</text><rect x="40" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="53" y="278" class="label">Lease expiry</text><text x="53" y="304" class="small">A may still resume</text><rect x="315" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="328" y="278" class="label">Protected effect</text><text x="328" y="304" class="small">dedupe / fencing</text><rect x="590" y="255" width="170" height="65" rx="10" fill="#fff" stroke="#afc8ae"/><text x="603" y="278" class="label">Run outcome</text><text x="603" y="304" class="small">expected owner update</text><text x="30" y="380" class="small">One current lease is not the same as one physical executor; protect the side effect.</text></svg>